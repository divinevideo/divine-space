# ABOUTME: Fastly Compute configuration for divine-space
# ABOUTME: Serves the DiVine Space MySpace-style profile builder

authors = ["Divine Video"]
description = "DiVine Space - MySpace-inspired profile builder on Nostr"
language = "javascript"
manifest_version = 3
name = "divine-space"
service_id = "COuE4goKNdS56m7ZBbxgNn"

[local_server]

  [local_server.kv_stores]

    [local_server.kv_stores.divine-space-content]
      file = "./static-publisher/kvstore.json"
      format = "json"

[scripts]
  build = "npm run build"

[setup]

  [setup.kv_stores]

    [setup.kv_stores.divine-space-content]

    [setup.kv_stores.divine-space-names]
