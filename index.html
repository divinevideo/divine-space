<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="content-security-policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; frame-src 'self' https:; font-src 'self'; base-uri 'self'; manifest-src 'self'; connect-src 'self' blob: https: wss:; img-src 'self' data: blob: https:; media-src 'self' https:">

    <!-- Default SEO Meta Tags -->
    <title>DiVine Space - Your MySpace for Videos</title>
    <meta name="description" content="A nostalgic video social network powered by Nostr. Share short videos, connect with creators, and relive the MySpace era." />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://divine.space/" />
    <meta property="og:title" content="DiVine Space - Your MySpace for Videos" />
    <meta property="og:description" content="A nostalgic video social network powered by Nostr. Share short videos, connect with creators, and relive the MySpace era." />
    <meta property="og:image" content="https://divine.space/og-image.svg" />
    <meta property="og:site_name" content="DiVine Space" />

    <meta name="twitter:title" content="DiVine Space - Your MySpace for Videos" />

    <meta name="twitter:image" content="https://divine.space/og-image.svg" />

    <!-- oEmbed Discovery -->
    <link rel="alternate" type="application/json+oembed" href="https://relay.divine.video/api/oembed?url=https://divine.space/" title="DiVine Space" />

    <link rel="manifest" href="/manifest.webmanifest">
  </head>

    <div id="root"></div>
